<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<!-- Firebase settings: fill in firebase-config.js (same folder) -->
<script src="firebase-config.js"></script>
</head>
<body>
<title>NMD Sales Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: white app bar with blue underline tabs, quiet filter strip, open white canvas; tiles → charts → tables. Single light theme by choice. */
:root{
  color-scheme:light;
  --accent:#1f62c4; --accent-2:#2a78d6; --accent-bg:#eef4fd; --accent-line:#cfe0f7;
  --bg:#ffffff; --strip:#f7f9fc; --panel:#ffffff; --ink:#0f1a2b; --ink-2:#47536a; --ink-3:#7c879b;
  --line:#e4e9f0; --line-2:#eff2f7; --hover:#f5f8fd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --tgt:#0f1a2b;
  --good:#15804a; --good-bg:#e4f5eb; --warn:#9a6200; --warn-bg:#fcf1dc; --bad:#c03636; --bad-bg:#fce8e8;
  --heat:42,120,214;
  --f-display:"Sora","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mast{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 6px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.03em;flex:none}
.brandlogo{height:40px;width:auto;flex:none;display:block}
.mast .wrap>div:not(.right){padding-left:14px;border-left:1px solid var(--line)}
.mast h1{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.mast .sub{color:var(--ink-3);font-size:12px;letter-spacing:.02em}
.mast .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.mast .pill{background:var(--strip);border-color:var(--line);color:var(--ink-2)}
.mast .pill.live{color:var(--good);background:var(--good-bg);border-color:transparent}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--ink-2);font:600 13.5px var(--f-body);padding:10px 12px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--strip);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding-block:10px}
.fld{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600}
select,input[type=search],input[type=number],input[type=text],input[type=date]{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
select:hover,input:hover{border-color:var(--accent-line)}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.seg button{border:0;background:none;font:600 12.5px var(--f-body);color:var(--ink-2);padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent)}
.asof{margin-left:auto;font-size:12px;color:var(--ink-3)}
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:grid;gap:4px;align-content:start}
.tile .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .val{font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .val small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.tile .foot{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile.hero{background:var(--accent-bg);border-color:var(--accent-line)}
.tile.hero .lbl{color:var(--accent)} .tile.hero .val{color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent-2)}
.tile.hero .meter{background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--good);background:var(--good-bg)} .chip.dn{color:var(--bad);background:var(--bad-bg)} .chip.mid{color:var(--warn);background:var(--warn-bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.grid2,.grid32{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.card .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card .hd .note{font-size:12px;color:var(--ink-3)}
.card .hd .sp{margin-left:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:16px;border-radius:0}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--tgt);background:none}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--ink-3);font:11px var(--f-body);font-variant-numeric:tabular-nums}
svg.chart .grid{stroke:var(--line-2);stroke-width:1}
svg.chart .axis{stroke:var(--line);stroke-width:1}
svg.chart .lab{fill:var(--ink-2);font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:150px;max-width:280px}
.tip b{display:block;font-size:12.5px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--strip);color:var(--ink-3);font-weight:600;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td.wrap-t{white-space:normal;min-width:220px}
td .bar{display:inline-block;height:8px;border-radius:2px;background:var(--s1);vertical-align:middle;margin-right:8px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:12px}
.click{cursor:pointer}
.btn{font:600 13px var(--f-body);border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.gold{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{border-radius:8px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.msg.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.msg.info{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-bg)}
.tgt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tgt-grid label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
.tgt-grid input{width:100%}
.heat td.n{font-size:12.5px}
.more{display:flex;justify-content:center;padding:10px}
.lines td{background:var(--line-2);font-size:12.5px}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.sec-hd h2{margin:2px 0 0;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent)}
.mseg{flex-wrap:wrap}
.mseg button{min-width:42px}
.seg button:disabled{color:var(--ink-3);opacity:.45;cursor:not-allowed;background:none}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
@media (max-width:560px){.tile .val{font-size:22px}.asof{margin-left:0;width:100%}.mast h1{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

/* roles + sign-in cover */
.pill.role{background:var(--strip);border-color:var(--line);color:var(--ink-2)}
.pill.role.adm{background:var(--accent);border-color:var(--accent);color:#fff}
body.signed-out .filters,body.signed-out .tabs,body.signed-out #srcPill{display:none}
body.signed-out{background:var(--strip)}
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-width:980px;margin:clamp(8px,4vh,40px) auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 20px 60px rgba(15,26,43,.10)}
.cover-l{position:relative;padding:36px 36px 30px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#1f62c4 0%,#174c9c 100%);color:#fff;overflow:hidden}
.cover-l::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000,transparent 90%)}
.cover-l>*{position:relative;z-index:1}
.cover-logo{align-self:flex-start;background:#fff;border-radius:10px;padding:8px 12px;height:58px;width:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cover-eyebrow{margin-top:10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#cfe0f7}
.cover h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.02;letter-spacing:-.02em;color:#fff}
.cover-sub{margin:0;color:#dbe7f8;max-width:42ch}
.cover-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:auto 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.cover-meta dt{font-size:11px;color:#cfe0f7}.cover-meta dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.cover-r{display:flex;align-items:center;justify-content:center;padding:36px 30px}
.signin{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.signin .lock{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);border-radius:99px;padding:3px 10px}
.signin h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.01em}
.whos{display:grid;gap:10px}
.who{display:grid;grid-template-columns:46px 1fr 18px;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.who:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 22px rgba(31,98,196,.12)}
.who:disabled{opacity:.5;cursor:not-allowed;transform:none}
.who .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.who.adm .ic{background:linear-gradient(135deg,#e0262d,#a3141a)} .who.vw .ic{background:linear-gradient(135deg,#2a78d6,#174c9c)}
.who .ic svg{width:24px;height:24px}
.who b{display:block;font-size:16px}.who small{display:block;font-size:12.5px;color:var(--ink-3)}
.who .arr{color:var(--ink-3);font-size:20px}
.who-sub{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 0 58px}
.who-sub button{border-radius:99px;padding:5px 12px;font:600 12.5px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.as{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.as .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.as .av.adm{background:linear-gradient(135deg,#e0262d,#a3141a)}.as .av.vw{background:linear-gradient(135deg,#2a78d6,#174c9c)}
.as div{display:flex;flex-direction:column;margin-right:auto;min-width:0}.as small{color:var(--ink-3);font-size:12px}
.as button{background:none;border:0;color:var(--accent);font:600 12.5px var(--f-body);cursor:pointer;text-decoration:underline}
.signin label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.signin input[type=password]{font-size:16px;padding:10px 12px;border-radius:10px}
.btn.big{padding:11px;font-size:15px;border-radius:10px}
.subh{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.adduser{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;align-items:end}
.adduser label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
#userTbl input,#userTbl select{width:100%;min-width:140px}
@media (max-width:760px){.cover{grid-template-columns:1fr}.cover-r{order:-1}.cover-l{padding:24px 22px}.cover-meta{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.cover{animation:fade .45s ease-out}}

/* ===== Sales view refresh: brighter, card-led dashboard ===== */
:root{--accent:#2156d9;--accent-2:#2f6ff0;--accent-bg:#edf3ff;--accent-line:#c9daff;--bg:#f4f7fc;--strip:#ffffff;--line:#e3e9f3;--line-2:#eef2f8;--hover:#f3f7ff;--brand:#e3262d;
  --g-hero:linear-gradient(135deg,#1d4ed8 0%,#2f6ff0 45%,#6d4dfa 100%);--sh-1:0 1px 2px rgba(16,32,64,.05),0 6px 20px rgba(16,32,64,.06);--sh-2:0 14px 34px rgba(33,86,217,.16)}
body{background:var(--bg)}
.mast{background:#fff;border-bottom:0;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(16,32,64,.04);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand) 0 18%,var(--accent) 18% 100%)}
.mast .wrap:first-child{padding-block:14px 8px}
.tabs{gap:6px;padding-bottom:12px}
.tabs button{border:1px solid transparent;border-radius:999px;padding:8px 16px;margin:0;background:transparent;color:var(--ink-2)}
.tabs button:hover{background:var(--hover);color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(33,86,217,.25)}
.filters{background:transparent;border-bottom:0;padding-top:14px}
.filters .wrap>*{flex:none}
.filters .wrap{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);padding:10px 14px;max-width:calc(1320px - 32px);margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));}
@media (min-width:1352px){.filters .wrap{margin-inline:auto}}
.seg{background:var(--line-2);border-color:transparent;border-radius:10px;padding:3px}
.seg button{border-radius:8px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(16,32,64,.15)}
.tiles{gap:14px}
.tile{position:relative;border-radius:16px;padding:16px 18px 16px;box-shadow:var(--sh-1);border-color:var(--line);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(16,32,64,.10)}
.tile .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;background:var(--accent-bg);color:var(--accent)}
.tile .tic svg{width:19px;height:19px}
.tile[data-ic="target"] .tic{background:#fff3e6;color:#d9670b}
.tile[data-ic="trend"] .tic{background:#e6f7ef;color:#12895a}
.tile[data-ic="box"] .tic{background:#f1ebff;color:#6d4dfa}
.tile[data-ic="speed"] .tic{background:#fff0f0;color:#d93b3b}
.tile[data-ic="receipt"] .tic{background:#eaf6fb;color:#0f7fa8}
.tile[data-ic="sum"] .tic{background:#eef2ff;color:#3b4fd8}
.tile .lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.tile .val{font-size:28px;font-weight:700;letter-spacing:-.03em}
.tile.hero{background:var(--g-hero);border-color:transparent;color:#fff;box-shadow:var(--sh-2);grid-column:span 2}
.tile.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.tile.hero::before{content:"";position:absolute;right:24px;bottom:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.08);pointer-events:none}
.tile.hero .lbl,.tile.hero .val,.tile.hero .foot,.tile.hero .val small{color:#fff}
.tile.hero .lbl{opacity:.85}.tile.hero .foot{opacity:.92}
.tile.hero .val{font-size:40px}
.tile.hero .tic{background:rgba(255,255,255,.18);color:#fff}
.tile.hero .meter{background:rgba(255,255,255,.25);height:8px}
.tile.hero .meter i{background:linear-gradient(90deg,#ffd166,#fff)}
.tile.hero .chip.up{background:rgba(255,255,255,.2);color:#fff}.tile.hero .chip.dn{background:rgba(255,80,80,.3);color:#fff}.tile.hero .chip.mid{background:rgba(255,209,102,.3);color:#fff}
.meter{height:7px;border-radius:99px}.meter i{border-radius:99px;background:linear-gradient(90deg,var(--accent),#6d4dfa)}
@media (max-width:560px){.tile.hero{grid-column:auto}.tile.hero .val{font-size:32px}}
.card{border-radius:16px;box-shadow:var(--sh-1);padding:20px}
.card h2{font-size:16px}
.card .hd{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line-2)}
.sec-hd{border-top:0;padding-top:18px}
.sec-hd h2{font-size:22px}
.eyebrow{display:inline-block;background:var(--accent-bg);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:11.5px;letter-spacing:.02em}
.tbl-wrap{border-radius:12px}
th{background:#f7f9fd}
td .bar{height:9px;border-radius:99px;background:linear-gradient(90deg,var(--accent),#6d4dfa)}
.chip{border-radius:99px;padding:2px 8px}
.btn{border-radius:10px}
.btn.pri{box-shadow:0 6px 16px rgba(33,86,217,.22)}
.mseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.legend i{border-radius:4px}
svg.chart .grid{stroke:#edf1f7;stroke-dasharray:3 4}
@media (prefers-reduced-motion:no-preference){
  .tiles>.tile{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .tiles>.tile:nth-child(2){animation-delay:.05s}.tiles>.tile:nth-child(3){animation-delay:.1s}.tiles>.tile:nth-child(4){animation-delay:.15s}.tiles>.tile:nth-child(5){animation-delay:.2s}
  svg.chart path[fill]:not([fill="transparent"]){transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
  svg.chart polyline{stroke-dasharray:3000;animation:draw 1.3s ease-out both}

.cv-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1000px 600px at 10% 0%,#2f4fd6 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#6d2fd6 0%,transparent 55%),linear-gradient(160deg,#0d1a4a,#0a1233)}
.cv-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.cv-bg i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.cv-bg .o1{width:320px;height:320px;left:-80px;top:20%;background:#3b82f6}
.cv-bg .o2{width:280px;height:280px;right:6%;top:-60px;background:#e3262d;opacity:.35}
.cv-bg .o3{width:360px;height:360px;right:-100px;bottom:-120px;background:#8b5cf6}
.cover{position:relative;z-index:1;max-width:1060px;width:100%;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.06);backdrop-filter:blur(14px);box-shadow:0 40px 100px rgba(3,8,30,.55);grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.cover-l{background:linear-gradient(160deg,rgba(33,86,217,.55),rgba(109,77,250,.35));padding:34px 36px 28px;gap:14px}

.cv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cover-logo{height:52px;border-radius:12px;padding:8px 12px}
.cv-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#dfe8ff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.08)}

.cover-sub{color:#d6e0ff}
.cv-chart{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 14px 8px}
.cv-chart svg{width:100%;height:auto;display:block}
.cv-chart .cb{fill:url(#none);fill:#9db7ff;opacity:.9}

.cv-chart .cl{fill:none;stroke:#ffd166;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cv-months{display:grid;grid-template-columns:repeat(12,1fr);font-size:10.5px;color:#b9c7f0;text-align:center;padding:2px 6px 0}
.cv-chips{display:flex;flex-wrap:wrap;gap:6px}
.cv-chips span{font-size:12px;color:#e6edff;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);border-radius:99px;padding:3px 10px}
.cover-meta{border-top-color:rgba(255,255,255,.18);margin-top:2px}
.cover-r{background:#fff;padding:40px 34px}
.signin h2{font-size:26px}
.signin .lock{background:linear-gradient(90deg,#edf3ff,#f3edff)}
.who{border-radius:14px;padding:16px}
.who:hover{border-color:var(--accent);box-shadow:0 12px 28px rgba(33,86,217,.16)}
.who.vw .ic{background:linear-gradient(135deg,#2f6ff0,#6d4dfa)}
.btn.big{background:linear-gradient(90deg,#2156d9,#6d4dfa);border:0;box-shadow:0 10px 24px rgba(33,86,217,.3)}
@media (max-width:760px){.cover{grid-template-columns:1fr}.cover-r{order:-1;padding:28px 22px}.cv-chart{display:none}.cover-l{padding:24px 22px}}
@media (prefers-reduced-motion:no-preference){
  .cv-chart .cb{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
  .cv-chart .cl{stroke-dasharray:900;animation:draw 2s .5s ease-out both}

  .cv-bg .o1{animation:float1 14s ease-in-out infinite alternate}.cv-bg .o3{animation:float2 18s ease-in-out infinite alternate}
  .cover{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
}
.cv-mlogo{display:none;height:40px;width:auto;align-self:flex-start}
@media (max-width:760px){.cv-mlogo{display:block}}

  ${mi.live ? `<div class="tile"><span class="lbl">Asking rate</span><span class="val">${ask != null ? fLn(ask) + uTag('/day') : '–'}</span>
    <span class="foot">${ask != null ? `${remWD} working days left · running at ${fL(avg)}/day` : mT && tot >= mT ? 'Month target met' : `Avg ${fL(avg)} per dispatch day`}</span></div>`

    <span class="foot">${best ? `Best day ${best} ${MON[m]}: ${fL(byDay[best])}` : 'No dispatches'}</span></div>`}
  ${qtyTile('Sales qty · ' + MON[m], rows, lyRows, mi.live ? 'vs same days LY' : 'vs ' + MON[m] + ' LY', qtgt(fy) ? qtgt(fy)[m] : null, 'month target')}
  </section>`;
}

function cumTiles(fy, m) {
  const mi = mInfo(fy, m), pf = prevFY(fy), T = tgt(fy);

  const cT = T ? T.slice(0, m).reduce((a, b) => a + (b || 0), 0) + (T[m] || 0) * (mi.live ? mi.upto / mi.dim : 1) : null;
  const annT = T ? T.reduce((a, b) => a + (b || 0), 0) : null;
  const span = 'Apr – ' + (mi.live ? mi.upto + ' ' : '') + MON[m];
  return `<div class="sec-hd" style="padding-top:6px;margin-top:0"><div><div class="eyebrow">Cumulative</div><h2 style="font-size:16px">${span} ${mi.y}</h2></div></div>
  <section class="tiles">
  <div class="tile hero"><span class="lbl">Cumulative sales · ${span}</span><span class="val">${fLn(tot)}${uTag()}</span>
    <span class="foot">${fAlt(tot)}${annT ? ' · ' + fP(pct(tot, annT)) + ' of annual ABP' : ''}</span>
    ${annT ? `<div class="meter"><i style="width:${Math.min(100, pct(tot, annT))}%"></i></div>` : ''}</div>
  <div class="tile"><span class="lbl">vs cumulative target</span><span class="val">${cT ? fP(pct(tot, cT)) : '–'}</span>
    <span class="foot">${cT ? `${tot >= cT ? '<span class="chip up">Ahead</span>' : '<span class="chip dn">Behind</span>'} Target ${fL(cT)} · ${tot >= cT ? 'ahead by' : 'short by'} ${fL(Math.abs(tot - cT))}` : '<span class="muted">No target</span>'}</span></div>
  <div class="tile"><span class="lbl">vs last year, ${span}</span><span class="val" style="color:${ly ? (tot >= ly ? 'var(--good)' : 'var(--bad)') : 'inherit'}">${ly ? (tot >= ly ? '+' : '') + fP((tot / ly - 1) * 100) : '–'}</span>
    <span class="foot">${ly ? `FY ${pf}: ${fL(ly)} · ${tot >= ly ? '+' : '−'}${fL(Math.abs(tot - ly))}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${qtyTile('Cumulative qty · ' + span, rows, lyRows, 'vs LY', qtPro(fy, m, mi.live ? mi.upto / mi.dim : 1), 'target')}
  </section>`;
}

function catTable(fy, key, label, limit = 12, m = null) {
  const c = ctx(fy), pf = prevFY(fy), mi = m == null ? null : mInfo(fy, m), o = key === 'cc' ? { noCC: true } : {};

  const lyR = !pf ? [] : m == null ? filt(pf, Object.assign({ upto: c.lyUpto }, o)) : filt(pf, o).filter(r => r.m === m && (!mi.live || r.dd <= mi.upto));
  const ly = groupSum(lyR, key);
  const list = [...cur.entries()].sort((a, b) => b[1] - a[1]); const mx = list.length ? list[0][1] : 1;
  const shown = list.slice(0, limit), rest = list.slice(limit);
  const body = shown.map(([k, v]) => { const l = ly.get(k); return `<tr><td>${esc(k)}</td><td class="n"><span class="bar" style="width:${Math.max(2, v / mx * 60)}px"></span>${fLn(v)}</td><td class="n">${fP(pct(v, tot))}</td><td class="n muted">${l ? fLn(l) : '–'}</td><td class="n">${l ? chipG((v / l - 1) * 100) : '<span class="chip up">new</span>'}</td></tr>`; }).join('');

  <tfoot><tr><td>Total</td><td class="n">${fLn(tot)}</td><td class="n">100%</td><td class="n muted">${pf ? fLn(sum(lyR)) : '–'}</td><td></td></tr></tfoot></table></div>`;
}

function topParts(fy, n = 10, mm = null) {

  const m = new Map(); for (const r of filt(fy)) { if (!pr(r)) continue; const k = r.part; const o = m.get(k) || { part: r.part, desc: r.desc, pc: r.pc, qty: 0, amt: 0 }; o.qty += r.qty; o.amt += r.amt; m.set(k, o); }

}

function monthSales(fy, sp) {

  <tbody>${rows.slice(0, M.n).map(r => `<tr><td>${fD(r.t)}</td><td class="mono">${esc(r.inv)}</td><td class="wrap-t" style="min-width:180px">${esc(r.cust)}</td><td class="mono">${esc(r.part)}</td><td class="wrap-t">${esc(r.desc)}</td><td>${esc(r.pc)}</td><td class="n">${fQ(r.qty)}</td><td class="n">${r.qty ? nf2.format(r.amt / r.qty) : '–'}</td><td class="n"><b>${nf0.format(r.amt)}</b></td></tr>`).join('') || '<tr><td colspan="9" class="empty">No lines match</td></tr>'}</tbody>

}
function bindMonthSales(fy, sp) {

/* ---------- date view ---------- */
const o2iso = (fy, o) => new Date(fyStart(fy) + o * 864e5).toISOString().slice(0, 10);
const iso2o = (fy, s) => { const t = Date.parse(s + 'T00:00:00Z'); return isNaN(t) ? null : Math.round((t - fyStart(fy)) / 864e5); };
const oT = (fy, o) => fyStart(fy) + o * 864e5;
function lyO(fy, o) { const pf = prevFY(fy); if (!pf) return null; const d = new Date(oT(fy, o)); let t = Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate()); if (new Date(t).getUTCMonth() !== d.getUTCMonth()) t -= 864e5; return Math.round((t - fyStart(pf)) / 864e5); }
function dayTarget(fy, o, T = tgt(fy)) { if (!T) return null; const d = new Date(oT(fy, o)); if (d.getUTCDay() === 0) return 0; const m = fm(d.getUTCMonth()); return T[m] ? T[m] / workDays(fy, m, 1, daysIn(fy, m)) : 0; }
function rangeTarget(fy, a, b, T = tgt(fy)) { if (!T) return null; let s = 0; for (let o = a; o <= b; o++) s += dayTarget(fy, o, T); return s; }
const dLabel = (fy, a, b) => a === b ? fD(oT(fy, a)) : fD(oT(fy, a)) + ' – ' + fD(oT(fy, b));
function dSpec(fy, a, b) { return { pred: r => r.o >= a && r.o <= b, label: dLabel(fy, a, b), fname: `NMD_sales_${o2iso(fy, a)}${a === b ? '' : '_to_' + o2iso(fy, b)}.csv` }; }
function mSpec(fy, m) { return { pred: r => r.m === m, label: mLabel(fy, m), fname: `NMD_sales_${MON[m]}_${mInfo(fy, m).y}.csv` }; }

function dateTiles(fy, a, b) {
  const pf = prevFY(fy), rows = filt(fy).filter(r => r.o >= a && r.o <= b), tot = sum(rows), tg = rangeTarget(fy, a, b);
  const la = lyO(fy, a), lb = lyO(fy, b), lyRows = pf ? filt(pf).filter(r => r.o >= la && r.o <= lb) : null, ly = lyRows ? sum(lyRows) : null;
  const one = a === b, days = new Set(rows.map(r => r.o)).size, invs = new Set(rows.map(r => r.inv)).size, custs = new Set(rows.map(r => r.cust)).size;
  return `<section class="tiles">
  <div class="tile hero"><span class="lbl">Sales · ${dLabel(fy, a, b)}</span><span class="val">${fLn(tot)}${uTag()}</span>
    <span class="foot">${fAlt(tot)} · ${one ? new Date(oT(fy, a)).toLocaleDateString('en-IN', { weekday: 'long', timeZone: 'UTC' }) : (b - a + 1) + ' days, ' + days + ' with dispatch'}</span></div>
  <div class="tile"><span class="lbl">vs ${one ? 'daily' : 'period'} target</span><span class="val">${tg ? fP(pct(tot, tg)) : '–'}</span>
    <span class="foot">${tg ? `${tot >= tg ? '<span class="chip up">Above</span>' : '<span class="chip dn">Below</span>'} Needed ${fL(tg)} · ${tot >= tg ? 'over by' : 'short by'} ${fL(Math.abs(tot - tg))}` : tg === 0 ? '<span class="muted">Sunday · no target</span>' : '<span class="muted">No target</span>'}</span></div>
  <div class="tile"><span class="lbl">vs same ${one ? 'date' : 'dates'} last year</span><span class="val" style="color:${ly ? (tot >= ly ? 'var(--good)' : 'var(--bad)') : 'inherit'}">${ly ? (tot >= ly ? '+' : '') + fP((tot / ly - 1) * 100) : '–'}</span>
    <span class="foot">${pf ? `${dLabel(pf, la, lb)}: ${fL(ly || 0)}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${qtyTile('Sales qty', rows, lyRows, 'vs LY', rangeTarget(fy, a, b, qtgt(fy)), a === b ? 'daily target' : 'period target')}
  <div class="tile"><span class="lbl">Invoices · customers</span><span class="val">${fQ(invs)}</span><span class="foot">${custs} customers · ${fQ(rows.length)} lines</span></div>
  </section>`;
}
function dateCum(fy, b) {
  const pf = prevFY(fy), T = tgt(fy), d = new Date(oT(fy, b)), m = fm(d.getUTCMonth()), dd = d.getUTCDate(), dim = daysIn(fy, m);
  const ytd = filt(fy).filter(r => r.o <= b), ytdV = sum(ytd), mtdV = sum(ytd.filter(r => r.m === m));
  const lb = lyO(fy, b), lyY = pf ? sum(filt(pf).filter(r => r.o <= lb)) : null;
  const lyM = pf ? sum(filt(pf).filter(r => r.o <= lb && r.m === m)) : null;
  const yT = T ? T.slice(0, m).reduce((x, y) => x + (y || 0), 0) + (T[m] || 0) * dd / dim : null, mT = T ? (T[m] || 0) * dd / dim : null;

  return `<div class="sec-hd" style="padding-top:6px;margin-top:0"><div><div class="eyebrow">Cumulative up to ${fD(oT(fy, b))}</div><h2 style="font-size:16px">Month to date and year to date</h2></div></div>
  <section class="tiles">

    <span class="foot">${mT ? chipA(pct(mtdV, mT)) + ' of pro-rata ' + fL(mT) : ''}${lyM ? ' ' + chipG((mtdV / lyM - 1) * 100) + ' vs LY' : ''}</span>${T && T[m] ? `<div class="meter"><i style="width:${Math.min(100, pct(mtdV, T[m]))}%"></i></div><span class="foot muted">${fP(pct(mtdV, T[m]))} of full-month target ${fL(T[m])}</span>` : ''}</div>
  <div class="tile hero"><span class="lbl">Apr 1 – ${dd} ${MON[m]} (YTD)</span><span class="val">${fLn(ytdV)}${uTag()}</span>

async function restoreBackup(txt, name) {

  try {
    for (const fy of FYS) { const x = o.fys[fy]; if (!x || !x.pack || !x.pack.r || !x.pack.r.length) continue;
      const recs = decode(fy, x.pack); m.innerHTML = `<div class="msg info">Restoring FY ${fy} (${fQ(recs.length)} lines)…</div>`;

      if (DB && isAdmin()) await DB.doc('settings/targets').set(Object.assign({}, serialTargets(), { updatedAt: new Date().toISOString(), by: MY_ID || null })); }
    PENDING = null; S.view = 'data'; refreshAll(); toast('Backup restored: data and targets are loaded' + (DB && isAdmin() ? ' for everyone.' : ' in this view.'));
  } catch (e) { m.innerHTML = `<div class="msg err">Restore stopped (${esc(e.code || e.message)}).</div>`; }
}
function downloadText(name, text) { download(name, null, text); }

    if (mr >= 0) ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: mr, c: mc } }); }

const fbMsg = e => { const c = (e && e.code) || ''; return /wrong-password|invalid-credential|invalid-login|user-not-found/.test(c) ? 'That password is wrong. Try again.' : /too-many-requests/.test(c) ? 'Too many tries. Wait a few minutes and try again.' : /weak-password/.test(c) ? 'Password needs at least 6 characters.' : /email-already-in-use/.test(c) ? 'That login name already exists in Firebase. Delete it in Firebase → Authentication first, or pick another name.' : /network/.test(c) ? 'No internet connection to Firebase.' : (e && e.message) || 'Something went wrong.'; };

function vSetup() {
  $('#main').innerHTML = `<div class="cv-bg" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i></div><div class="cover" style="grid-template-columns:1fr;max-width:520px"><div class="cover-r"><form class="signin" id="suForm" autocomplete="off">
    <img class="cv-mlogo" style="display:block" src="${$('.brandlogo').src}" alt="NMD"><span class="lock">First-time setup</span><h2>Create the first Admin</h2>
    <p class="muted" style="margin:0">This runs once. The Admin can then add other logins from the Users tab.</p>
    <label for="su-u">Login name<input type="text" id="su-u" value="admin" autocomplete="username"></label>
    <label for="su-n">Display name<input type="text" id="su-n" value="Admin"></label>
    <label for="su-p">Password (6+ characters)<input type="password" id="su-p" autocomplete="new-password"></label>
    <div class="msg err" id="suErr" hidden></div><button class="btn pri big" type="submit">Create Admin and open</button></form></div></div>`;
  $('#suForm').onsubmit = async e => {

    if (!/^[a-z0-9._-]{2,30}$/.test(u)) { er.textContent = 'Login name: 2–30 letters, numbers, dot, dash or underscore.'; er.hidden = false; return; }
    try { let cred; try { cred = await FB.auth.createUserWithEmailAndPassword(fbEmail(u), p); } catch (x) { if (/email-already-in-use/.test(x.code)) cred = await FB.auth.signInWithEmailAndPassword(fbEmail(u), p); else throw x; }
      const uid = cred.user.uid, b = FB.fs.batch();
      b.set(FB.fs.doc('roles/' + uid), { u, name: n, role: 'admin' });
      b.set(FB.fs.doc('public/logins'), { users: [{ uid, u, name: n, role: 'admin' }] });
      b.set(FB.fs.doc('config/setup'), { at: new Date().toISOString(), by: uid });
      await b.commit();
      LOGIN = { u, name: n, role: 'admin', uid }; CAN_EDIT = true; MY_ID = uid; FB_UNSUB = subscribeData(FB.fs); toast('Admin created.'); refreshAll();

}

function vUsersFB() {

  <section class="card"><div class="hd"><h2>Add a login</h2></div>
  <div class="adduser"><label for="nu-u">Login name<input type="text" id="nu-u" placeholder="e.g. sales"></label><label for="nu-n">Display name<input type="text" id="nu-n" placeholder="e.g. Sales team"></label>
  <label for="nu-r">Role<select id="nu-r"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></label><label for="nu-p">Password<input type="password" id="nu-p" autocomplete="new-password"></label>
  <button class="btn pri" id="nuAdd">Add login</button></div></section></div>`;
  const fs = FB.fs;
  const writeList = async list => { if (!list.some(x => x.role === 'admin')) { toast('Keep at least one Admin.'); return false; } await fs.doc('public/logins').set({ users: list }); return true; };
  $('#usSave').onclick = async () => { try { const b = fs.batch(); us.forEach((u, i) => { u.name = $(`#un-${i}`).value.trim() || u.u; u.role = $(`#ur-${i}`).value; b.set(fs.doc('roles/' + u.uid), { u: u.u, name: u.name, role: u.role }); });
      if (!us.some(x => x.role === 'admin')) return toast('Keep at least one Admin.'); b.set(fs.doc('public/logins'), { users: us }); await b.commit(); toast('Logins saved.'); refreshAll(); } catch (e) { toast(fbMsg(e)); } };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const u = us[+b.dataset.del]; if (u.uid === MY_ID) return toast("You can't delete the login you are using.");
    try { const rest = us.filter(x => x.uid !== u.uid); if (!(await writeList(rest))) return; await fs.doc('roles/' + u.uid).delete(); toast(`${u.u} removed. Also delete ${fbEmail(u.u)} in Firebase → Authentication if you want to reuse the name.`); refreshAll(); } catch (e) { toast(fbMsg(e)); } });
  $('#nuAdd').onclick = async () => {
    const u = $('#nu-u').value.trim().toLowerCase(), n = $('#nu-n').value.trim() || u, r = $('#nu-r').value, p = $('#nu-p').value;
    if (!/^[a-z0-9._-]{2,30}$/.test(u)) return toast('Login name: 2–30 letters, numbers, dot, dash or underscore.');
    if (us.some(x => x.u === u)) return toast('That login name is already used.');
    if (p.length < 6) return toast('Password needs at least 6 characters.');
    try { const sec = firebase.apps.find(a => a.name === 'userAdmin') || firebase.initializeApp(FB_CFG, 'userAdmin');
      const cred = await sec.auth().createUserWithEmailAndPassword(fbEmail(u), p); const uid = cred.user.uid; await sec.auth().signOut();
      const b = fs.batch(); b.set(fs.doc('roles/' + uid), { u, name: n, role: r }); b.set(fs.doc('public/logins'), { users: us.concat([{ uid, u, name: n, role: r }]) }); await b.commit();

  };
  $('#myPw').onclick = async () => { const p = prompt('New password for ' + LOGIN.u + ' (6+ characters):'); if (!p) return; try { await FB.auth.currentUser.updatePassword(p); toast('Password changed.'); } catch (e) { toast(/requires-recent-login/.test(e.code) ? 'For safety, sign out and sign in again, then change the password.' : fbMsg(e)); } };
}

/* ---------- shared store ---------- */
let DB = null, CAN_EDIT = false, MY_ID = null, MY_NAME = '', USER = null; const LOADED_VER = {};
async function loadUpload(meta) {
  const fy = meta.fy; if (!FYS.includes(fy) || LOADED_VER[fy] === meta.ver) return;
  const parts = []; for (let i = 0; i < meta.chunks; i++) { const s = await DB.doc(`chunks/fy-${fy}-${i}`).get(); const d = s.exists && s.data(); if (!d || d.ver !== meta.ver) return; parts.push(typeof d.pack === 'string' ? JSON.parse(d.pack) : d.pack); }
  const rows = parts.flatMap(p => decode(fy, p)); LOADED_VER[fy] = meta.ver;
  let byName = meta.byName || ''; try { if (meta.by && USER) { const ps = await USER.profiles([meta.by]); byName = (ps[meta.by] && ps[meta.by].name) || ''; } } catch (e) {}
  setFY(fy, rows, { kind: 'uploaded', file: meta.file, at: meta.at, byName }); refreshAll();
}
async function initStore() {
  if (FB_ON) return initFirebase();
  if (!window.claude || !window.claude.use) { AUTH_READY = true; refreshAll(); return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  USER = user; if (user) { try { CAN_EDIT = await user.canEdit(); MY_ID = await user.id(); MY_NAME = (await user.name()) || ''; } catch (e) {} }
  if (!db) { AUTH_READY = true; setPill(); refreshAll(); return; }
  DB = db; setPill();
  const authTimer = setTimeout(() => { if (!AUTH_READY) { AUTH_READY = true; refreshAll(); } }, 6000);
  db.doc('settings/auth').onSnapshot(s => { AUTH = s.exists ? s.data() : { users: [] }; restoreLogin(); const first = !AUTH_READY; AUTH_READY = true; clearTimeout(authTimer); refreshAll(!first); }, () => { AUTH_READY = true; refreshAll(); });
  subscribeData(db);
}
function subscribeData(db) {
  const un = [];
  un.push(db.doc('settings/targets').onSnapshot(s => { if (!s.exists) return; const d = s.data(); for (const fy of FYS) { const a = d['fy' + fy.replace('-', '_')]; if (Array.isArray(a) && a.length === 12) TARGETS[fy] = a.slice(); const q = d['qfy' + fy.replace('-', '_')]; if (Array.isArray(q) && q.length === 12) QTGT[fy] = q.slice(); const ab = d['abp' + fy.replace('-', '_')]; if (Array.isArray(ab) && ab.length === 12) ABP[fy] = ab.slice(); } refreshAll(true); }, () => {}));
  un.push(db.collection('uploads').onSnapshot(async snap => {
    const seen = new Set();
    for (const doc of snap.docs) { const m = doc.data(); seen.add(m.fy); try { await loadUpload(m); } catch (e) {} }
    for (const fy of FYS) if (!seen.has(fy) && DATA[fy].meta.kind === 'uploaded' && LOADED_VER[fy]) { delete LOADED_VER[fy]; setFY(fy, decode(fy, SEED[fy]), { kind: 'built-in', src: SEED[fy].src }); refreshAll(); }
  }, () => {}));
  return un;
}
function setPill() {
  const p = $('#srcPill'), t = $('#srcTxt'), up = FYS.filter(f => DATA[f].meta.kind === 'uploaded');
  p.classList.toggle('live', !!DB);
  t.textContent = (FB_ON ? (DB ? 'Firebase' : 'Connecting') : FB_PLACEHOLDER ? 'Firebase settings not added yet' : DB ? 'Shared' : 'Offline copy') + (up.length ? ' · updated ' + up.join(', ') : ' · built-in data');
}

/* ---------- downloads ---------- */
async function download(name, rows, raw) {
  const csv = raw != null ? raw : rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
  if (!dl) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([(raw != null ? '' : '\ufeff') + csv], { type: raw != null ? 'application/json' : 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved ' + name); } catch (e) { toast('Downloads are not available in this view.'); } return; }
  try { await dl.save({ filename: name, data: (raw != null ? '' : '\ufeff') + csv }); toast('Saved ' + name); } catch (e) { if (e && e.code !== 'declined') toast('Could not save the file (' + (e.code || 'error') + ').'); }
}

function toast(t) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'msg'; el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.18)'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3500); }
/* ---------- shell ---------- */
const VIEWS = { users: vUsers, dashboard: vDashboard, monthly: vMonthly, customers: vCustomers, products: vProducts, invoices: vInvoices, targets: vTargets, data: vData };
function buildFilters() {
  $('#fySeg').innerHTML = FYS.slice().reverse().map(f => `<button data-fy="${f}" aria-pressed="${f === S.fy}">${f}</button>`).join('');
  document.querySelectorAll('[data-fy]').forEach(b => b.onclick = () => { S.fy = b.dataset.fy; S.dm = null; S.dr = null; S.inv.open.clear(); refreshAll(); });
  const ccs = [...new Set(FYS.flatMap(f => DATA[f].rows.map(r => r.cc)))].sort();
  if (S.cc !== 'All' && !ccs.includes(S.cc)) S.cc = 'All';
  $('#fCC').innerHTML = `<option value="All">All customers</option>` + ccs.map(p => `<option ${p === S.cc ? 'selected' : ''}>${esc(p)}</option>`).join('');
  $('#fCC').value = S.cc; $('#fCore').checked = S.core;
  { const c2 = ctx(S.fy), hv = new Set(filt(S.fy).map(r => r.m)), fm2 = $('#fMonth');
    fm2.innerHTML = `<option value="all">Full year</option>` + MON.map((n, i) => `<option value="${i}" ${(!c2.closed && i > c2.cm) || !hv.has(i) ? 'disabled' : ''}>${n} ${+S.fy.slice(0, 4) + (i >= 9 ? 1 : 0)}</option>`).join('');
    fm2.value = S.dm == null ? 'all' : String(S.dm); const showT = ['dashboard', 'invoices'].includes(S.view); $('#fMonthWrap').hidden = !showT; $('#fDateWrap').hidden = !showT;
    const mn = o2iso(S.fy, 0), mx = o2iso(S.fy, c2.asOfO), f1 = $('#fFrom'), f2 = $('#fTo');
    f1.min = f2.min = mn; f1.max = f2.max = mx; f1.value = S.dr ? o2iso(S.fy, S.dr.a) : ''; f2.value = S.dr && S.dr.b !== S.dr.a ? o2iso(S.fy, S.dr.b) : ''; $('#fDateClr').hidden = !S.dr; }
  const c = ctx(S.fy); $('#asof').textContent = `FY ${S.fy} data up to ${fD(c.asOfT)}`;
}
$('#fCC').onchange = e => { S.cc = e.target.value; refreshAll(); };
function onDates() { const a = iso2o(S.fy, $('#fFrom').value), b = iso2o(S.fy, $('#fTo').value); if (a == null && b == null) { S.dr = null; refreshAll(); return; } setDates(a ?? b, b ?? a); }
$('#fFrom').onchange = onDates; $('#fTo').onchange = onDates;
$('#fDateClr').onclick = () => { S.dr = null; refreshAll(); };
$('#fMonth').onchange = e => { S.dr = null; S.dm = e.target.value === 'all' ? null : +e.target.value; S.ms.q = ''; S.ms.n = 200; refreshAll(); };
$('#fCore').onchange = e => { S.core = e.target.checked; refreshAll(); };
const TILE_IC = {
  rupee: '<path d="M7 5h10M7 9h10M9 5c4 0 5 2 5 4s-1 4-5 4H7l7 6"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/>',
  trend: '<path d="M4 16l5-5 4 4 7-7"/><path d="M15 8h5v5"/>',
  box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
  speed: '<path d="M5 17a8 8 0 1114 0"/><path d="M12 13l4-4"/>',
  receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  sum: '<path d="M17 5H7l6 7-6 7h10"/>'
};
function tileIcon(lbl) { const s = lbl.toLowerCase(); return s.includes('qty') || s.includes('quantity') ? 'box' : s.includes('target') || s.includes('abp') ? 'target' : s.includes('last year') ? 'trend' : s.includes('asking') || s.includes('daily average') ? 'speed' : s.includes('invoice') ? 'receipt' : s.includes('cumulative') || s.includes('ytd') ? 'sum' : s.includes('q1') || s.includes('q2') || s.includes('q3') || s.includes('q4') || s.includes('mtd') || s.includes('month') ? 'cal' : 'rupee'; }
function decorate() {
  document.querySelectorAll('#main .tile').forEach(t => { if (t.querySelector('.tic')) return; const l = t.querySelector('.lbl'); if (!l) return; const k = tileIcon(l.textContent); t.dataset.ic = k;
    l.insertAdjacentHTML('beforebegin', `<span class="tic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${TILE_IC[k]}</svg></span>`); });
}
new MutationObserver(() => decorate()).observe(document.getElementById('main'), { childList: true, subtree: true });
function refreshAll(soft) {
  setRoleUI();
  const locked = !AUTH_READY || needLogin();
  document.body.classList.toggle('signed-out', locked);
  if (locked) { hideTip(); if (!AUTH_READY) { $('#main').innerHTML = `<div class="empty" style="padding:80px 16px"><img src="${$('.brandlogo').src}" alt="" style="height:48px;margin:0 auto 14px;display:block">Opening the Sales Tracker…</div>`; } else if (FB_ON && !FB) { $('#main').innerHTML = `<div class="empty" style="padding:80px 16px;color:#fff">Could not start Firebase.<br><small>${esc(FB_ERR)}</small><br><small>Check firebase-config.js and your internet connection.</small></div>`; } else if (FB_ON && FB_SETUP) { if (!document.getElementById('suForm')) vSetup(); } else if (!(soft && document.getElementById('lgPass'))) vCover(); return; }
  if (soft && (S.view === 'targets' || S.view === 'users')) return; // don't wipe inputs being edited
  UNIT = UNITS[S.unit] || CR; document.body.classList.toggle('u-act', UNIT === AC); document.querySelectorAll('.useg [data-u]').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === S.unit));
  saveUI(); buildFilters(); setPill(); hideTip(); VIEWS[S.view]();
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function go(v) { if (!VIEWS[v] || ((v === 'data' || v === 'users') && AUTH_READY && !isAdmin())) v = 'dashboard'; S.view = v; document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v)); try { history.replaceState(null, '', '#' + v); } catch (e) {} refreshAll(); window.scrollTo({ top: 0 }); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#signOut').onclick = signOut;
document.querySelectorAll('.useg [data-u]').forEach(b => b.onclick = () => { S.unit = b.dataset.u; try { localStorage.setItem('nmdSalesUnit', S.unit); } catch (e) {} refreshAll(); });
S.view = ['data', 'users'].includes((location.hash || '').slice(1)) ? 'dashboard' : ((location.hash || '').slice(1) || 'dashboard'); if (!VIEWS[S.view]) S.view = 'dashboard';
refreshAll();
initStore().catch(() => {});
